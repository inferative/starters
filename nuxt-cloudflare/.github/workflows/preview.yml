# A push to `main` runs the migrations and deploys the preview Worker.
# Precondition: the live Worker exists. The preview Worker binds its response cache, so deploy live first.
name: Preview

on:
  push:
    branches: [main]

# The preview and the live deploy share one database, so one group keeps their migrations apart.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Migrate and deploy the preview Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # `@inferative` and `@heximon` come from GitHub Packages. The organization secret holds the read token.
      - name: Point the private scopes at GitHub Packages
        run: |
          {
            echo "@inferative:registry=https://npm.pkg.github.com"
            echo "@heximon:registry=https://npm.pkg.github.com"
            echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}"
          } >> "$HOME/.npmrc"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READ_PACKAGES_TOKEN }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The migrations run over the direct connection, before the new code goes live.
      - name: Run the migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - run: pnpm build

      # The preview Worker binds the response cache of the live Worker, so the live Worker must exist first.
      - name: Check that the live Worker exists
        run: |
          if ! output=$(pnpm exec wrangler deployments list --config .output/server/wrangler.json 2>&1); then
            echo "$output"
            echo "::error::The live Worker is not deployed yet. The preview Worker uses its response cache. Run the Release workflow once (publish a release, or start it by hand), then run this workflow again."
            exit 1
          fi
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy the preview Worker
        run: pnpm deploy:preview
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
