# A published release runs the migrations, writes the data of the release and deploys the four Workers: the applets
# Worker and the rooms Worker, then the dashboard Worker, which binds the applet supervisor and the rooms by name, then the edge Worker, which binds the
# dashboard Worker (README, "The three Workers" and "Public read cache"). A manual run does the same.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

# One group keeps two deploys, and their migrations, apart.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Migrate and deploy the Workers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # `@inferative` and `@heximon` come from GitHub Packages. The organization secret holds the read token.
      - name: Point the private scopes at GitHub Packages
        run: |
          {
            echo "@inferative:registry=https://npm.pkg.github.com"
            echo "@heximon:registry=https://npm.pkg.github.com"
            echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}"
          } >> "$HOME/.npmrc"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READ_PACKAGES_TOKEN }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The migrations run over the direct connection, before the new code goes live.
      - name: Run the migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # The plans and the catalog of outside accounts are data of the release. Each task writes only what the database
      # lacks, so a second run writes nothing. It runs the app on the runner in development mode, with no Worker binding.
      - name: Write the data of the release
        run: pnpm release:data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build the dashboard Worker
        run: pnpm build

      - name: Build the applets Worker
        run: pnpm build:applets

      - name: Build the rooms Worker
        run: pnpm build:rooms

      # It goes first: the dashboard Worker binds its applet supervisor by name.
      - name: Deploy the applets Worker
        run: pnpm run deploy:applets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # It goes before the dashboard Worker too: the dashboard Worker binds its rooms by name. While it still holds the
      # namespace of a room that ran here before, which the deployed dashboard Worker binds, it waits for the step after
      # the dashboard Worker.
      - name: Deploy the rooms Worker
        run: pnpm run deploy:rooms
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # On the first deploy the edge Worker does not exist yet, so this deploy leaves the PUBLIC_READ_PURGE binding out.
      - name: Deploy the dashboard Worker
        run: pnpm run deploy:live
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Only when the step before the dashboard Worker waited: the upload deletes the old rooms that it no longer binds.
      - name: Deploy the rooms Worker after the dashboard Worker
        run: pnpm run deploy:rooms:after
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # It goes last: it binds the dashboard Worker and its fill entrypoint by name.
      - name: Deploy the edge Worker
        run: pnpm run deploy:edge
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Only after the first deploy: the dashboard Worker again, now with the binding to the edge Worker's cache.
      - name: Bind the dashboard Worker to the edge Worker's cache
        run: pnpm run deploy:bind
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # It goes after every Worker: while the migrations ran, the Workers of the earlier release still served, and they
      # did not record what this release added. Each statement is safe to run again.
      - name: Repair the data that the earlier Workers wrote during the release
        run: pnpm release:after
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
