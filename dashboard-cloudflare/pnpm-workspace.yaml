# The hosts of the deployment: the dashboard at the root, and the hosts of the split topology under `workers/`. The
# Heximon build reads this list to find which events each host subscribes to.
packages:
  - "."
  - "workers/*"

# `pnpm add` at the root adds to the dashboard, as in a project with one package.
ignoreWorkspaceRootCheck: true

# The settings that a Nuxt + Nitro install needs. pnpm reads them from this file only (a project `.npmrc` is ignored).

# Nuxt and Nitro resolve bare imports from the app root, so the flat install is required: `nuxt dev` fails without it.
shamefullyHoist: true
strictPeerDependencies: false
dedupePeers: true

# Nitro and Nuxt Fonts come from preview builds (the overrides below), and a preview build is a URL dependency.
blockExoticSubdeps: false

# The compiler's oxc binding for the Workers runtime targets wasm32, so an install accepts it beside the host CPU.
supportedArchitectures:
  cpu:
    - current
    - wasm32

# pnpm runs no dependency install script until you decide it here. An undecided script stops the install.
allowBuilds:
  esbuild: true
  oxc-resolver: true
  # The local Cloudflare runtime of `wrangler`.
  workerd: true
  better-sqlite3: false
  protobufjs: false
  vue-demi: false
  "@parcel/watcher": false

# One copy of each package that Nuxt, Nitro and the Heximon packages share. A second copy splits the DI tokens and
# the Nuxt contexts. These pins follow the monorepo of Inferative: change them only when it changes them.
